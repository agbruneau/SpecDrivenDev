name: ci
# Pipeline de spécification (SDD ch. 9, p. 141) : à chaque commit, vet + suite unitaire de chaque banc ;
# un échec identifie un cas d'utilisation dont le comportement a dérivé.
#
# Révision du 2026-09-12 (A-101, A-106, A-107) : la CI invoque le Makefile plutôt que de
# recopier ses commandes (« le Makefile dit QUOI, le CI dit OÙ »), exerce Windows — le poste
# de référence des campagnes, dont les tests `//go:build windows` ne tournaient jamais —, et
# borne son quota (timeout, permissions minimales, pas de double exécution sur PR interne).
#
# Révision du 2026-09-14 : le fichier vivait sous EscapeBench/.github/, que GitHub ne lit pas ;
# la CI n'avait jamais tourné. Il passe à la racine, compile avec go1.27.0, la toolchain des
# campagnes des deux bancs (A-106 : `go-version-file` rendait la dernière 1.25.x), et vérifie LeakLab.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  escapebench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: EscapeBench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          # Aucune dépendance externe (C-002) : pas de go.sum à mettre en cache.
          cache: false
      - name: make (absent des images Windows qui ne le fournissent pas)
        if: runner.os == 'Windows'
        run: command -v make || choco install make --no-progress -y
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: vet et suite unitaire
        run: make vet test
      - name: tests d'intégration (adapters réels)
        run: make integration_test
      - name: hooks (spec-lint, guard-paths, guard-bash, go-test)
        run: bash .claude/hooks/selftest.sh

  leaklab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: LeakLab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go 1.27 exigé par go.mod (profil goroutineleak, H-013).
          go-version: '1.27.0'
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: vet
        run: go vet ./...
      - name: suite unitaire
        run: go test -race -shuffle=on -count=1 ./...
